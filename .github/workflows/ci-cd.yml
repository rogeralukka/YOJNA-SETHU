name: Continuous Integration & Production Build Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    name: Run Automated Test Suite & Health Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Synchronize Database Schema
        run: npx prisma db push --accept-data-loss

      - name: Execute End-to-End Automated Test Suite (44 Tests)
        run: npm test

      - name: Verify Docker Container Build
        run: docker build -t gov-scheme-portal:latest .
