name: Continuous Integration & Production Build Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    name: Run Automated Test Suite & Health Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        env:
          DATABASE_URL: "file:./dev.db"
        run: npx prisma generate

      - name: Synchronize Database Schema
        env:
          DATABASE_URL: "file:./dev.db"
        run: npx prisma db push --accept-data-loss

      - name: Seed Database For Test Suite
        env:
          DATABASE_URL: "file:./dev.db"
        run: npm run seed

      - name: Execute End-to-End Automated Test Suite (50 Tests)
        env:
          DATABASE_URL: "file:./dev.db"
          JWT_SECRET: "super_secret_gov_portal_jwt_key_2026_secure"
        run: npm test

      - name: Verify Scheme Backend Module (TypeScript & Jest)
        working-directory: ./backend
        run: |
          npm ci
          npx prisma generate
          npm test

      - name: Verify Docker Container Build
        run: docker build -t gov-scheme-portal:latest .
