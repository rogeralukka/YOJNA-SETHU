name: Continuous Integration & Production Build Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    name: Run Automated Test Suite & Production Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            FRONTEND/package-lock.json

      - name: Verify Backend (Prisma, Database Sync, & 50 E2E Automated Tests)
        working-directory: ./backend
        env:
          DATABASE_URL: "file:./dev.db"
          JWT_SECRET: "super_secret_gov_portal_jwt_key_2026_secure"
        run: |
          npm ci
          npx prisma generate
          npx prisma db push --accept-data-loss
          npm run seed
          npm test

      - name: Verify Frontend Production Build
        working-directory: ./FRONTEND
        run: |
          npm ci
          npm run build

      - name: Verify Docker Container Build
        run: docker build -t gov-scheme-portal:latest .
