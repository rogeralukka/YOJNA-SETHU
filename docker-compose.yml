version: '3.8'

services:
  scheme-portal-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gov_scheme_portal_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=super_secret_gov_portal_jwt_key_2026_secure
      - JWT_EXPIRES_IN=7d
      - DATABASE_URL=file:/app/data/prod.db
      - CLIENT_URL=http://localhost:5000
      - UPLOAD_DIR=uploads
    volumes:
      - db_data:/app/data
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  db_data:
  uploads_data:
